              const state = {
                velocity: 2.5, fillLevel: 100, pipeGeo: 'straight', conductivity: 500, dn: 80,
                epdMode: 'ON_STANDARD', failsafeMode: 'MIN_NAMUR', activeFaultCode: null,
                totalizer: 3702.60, cutaway: true, showHotspots: true, selectedIcId: 'hd64f3048',
                lcdMenuIndex: 0, isBooting: false
              };

              function computeTelemetry() {
                const dMeters = state.dn / 1000;
                const area = Math.PI * Math.pow(dMeters / 2, 2);
                const B = 0.0018;
                let autoFault = null;
                if (state.conductivity < 5) autoFault = ERROR_DB.find(e => e.code === '#461');
                if (state.fillLevel < 85 && state.epdMode !== 'OFF') autoFault = ERROR_DB.find(e => e.code === '#401');
                const activeFault = state.activeFaultCode ? ERROR_DB.find(e => e.code === state.activeFaultCode) : autoFault;
                let profileFactor = 1.0, noisePct = 0.6;
                if (state.pipeGeo === 'spiral') { profileFactor = 1.048; noisePct = 4.2; }
                else if (state.pipeGeo === 'bubbles') { profileFactor = 0.94; noisePct = 14.5; }
                let effectiveV = state.velocity * profileFactor;
                if (state.fillLevel === 0) effectiveV = state.epdMode === 'OFF' ? 0.35 : 0.0;
                else if (state.fillLevel < 85) effectiveV = state.velocity * (state.fillLevel / 100) * 1.15;
                if (activeFault && activeFault.code === 'SYM-NEG') effectiveV = -Math.abs(state.velocity || 2.5);
                let emfMicroV = B * dMeters * effectiveV * 1e6 * (state.fillLevel > 10 ? 1 : 0.05);
                if (activeFault && activeFault.code === '#321') emfMicroV = 0;
                const maxFlowM3h = area * 10.0 * 3600;
                let flowM3h = area * effectiveV * 3600;
                const ratio = Math.min(1.2, Math.max(0, Math.abs(flowM3h) / (maxFlowM3h * 0.5)));
                let currentMa = 4.0 + ratio * 16.0;
                let freqHz = ratio * 1000.0;
                let statusConductive = true, totalizerCounting = true;
                if (activeFault) {
                  if (activeFault.code === 'SYM-4MA') currentMa = 4.00;
                  else if (activeFault.code === '#601') { currentMa = 4.00; freqHz = 0.0; flowM3h = 0.0; totalizerCounting = false; }
                  else if (activeFault.severity === 'FAULT') {
                    statusConductive = false;
                    if (state.failsafeMode === 'MIN_NAMUR') { currentMa = 3.50; freqHz = 0.0; totalizerCounting = false; }
                    else if (state.failsafeMode === 'MAX_NAMUR') { currentMa = 22.60; freqHz = 0.0; totalizerCounting = false; }
                    else if (state.failsafeMode === 'HOLD') { totalizerCounting = false; }
                  }
                }
                return { dMeters, B, effectiveV, emfMicroV, flowM3h, maxFlowM3h, currentMa, freqHz, noisePct, statusConductive, totalizerCounting, activeFault };
              }

              let scene, camera, renderer, animId, fluidMesh, spiralBendMesh, sensorShellMesh, epdElectrodeMesh;
              let fluidParticles = [], fieldArrows = [];
