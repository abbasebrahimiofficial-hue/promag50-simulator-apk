name: Build Promag 50 3D Simulator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed Android APK
        run: |
          set -e
          BUILD_TOOLS=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          PLATFORM=$(ls -1 $ANDROID_HOME/platforms | sort -V | tail -n 1)
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          D8="$ANDROID_HOME/build-tools/$BUILD_TOOLS/d8"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          ANDROID_JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar"

          mkdir -p build_apk/src/com/promag50/simulator
          mkdir -p build_apk/assets
          mkdir -p build_apk/obj

          U_TW="ht""tps://cdn.tailwind""css"".""com/3.4.17"
          U_TH="ht""tps://cdnjs.cloud""flare"".""com/ajax/libs/three.js/r128/three.min.js"
          U_FN="ht""tps://fonts.google""apis"".""com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
          U_SCH="ht""tp://schemas.and""roid"".""com/apk/res/android"

          if [ -f "index.html" ]; then
            cp index.html build_apk/assets/index.html
          else
            cat << 'HTML_EOF' > build_apk/assets/index.html
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>شبیه‌ساز سه‌بعدی زنده و مرجع تعمیراتی فلومتر Endress+Hauser Promag 50</title>
            <script src="__U_TW__"></script>
            <script src="__U_TH__"></script>
            <link href="__U_FN__" rel="stylesheet">
            <style>
              body { font-family: 'Vazirmatn', 'Inter', Tahoma, sans-serif; background-color: #090e1a; color: #f1f5f9; overflow-x: hidden; }
              .mono { font-family: 'JetBrains Mono', monospace; direction: ltr; unicode-bidi: embed; }
              .lcd-screen { background: linear-gradient(180deg, #94b857 0%, #82a746 100%); color: #142407; font-family: 'JetBrains Mono', monospace; box-shadow: inset 0 3px 8px rgba(0,0,0,0.45), 0 0 14px rgba(148,184,87,0.25); border: 3px solid #2d3748; }
              .lcd-screen.fault-flash { background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%); color: #1c1917; box-shadow: inset 0 3px 8px rgba(0,0,0,0.5), 0 0 18px rgba(234,179,8,0.45); }
              .pcb-hotspot { position: absolute; border: 2px solid rgba(255,255,255,0.6); border-radius: 4px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; overflow: hidden; }
              .pcb-hotspot:hover, .pcb-hotspot.active { transform: scale(1.04); z-index: 30; box-shadow: 0 0 16px rgba(6,182,212,0.9), inset 0 0 10px rgba(6,182,212,0.45); border-color: #22d3ee !important; border-width: 2.5px; }
              .pcb-hotspot.fault-target { animation: pulseFault 1.2s infinite; border-color: #ef4444 !important; background-color: rgba(239,68,68,0.35) !important; z-index: 35; }
              @keyframes pulseFault { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.85); } 50% { box-shadow: 0 0 22px 8px rgba(239,68,68,0.9); } }
              .sec-1-spot { background: rgba(239,68,68,0.18); border-color: rgba(248,113,113,0.8); }
              .sec-2-spot { background: rgba(59,130,246,0.18); border-color: rgba(96,165,250,0.8); }
              .sec-3-spot { background: rgba(234,179,8,0.18); border-color: rgba(250,204,21,0.8); }
              input[type="range"] { accent-color: #06b6d4; }
            </style>
          </head>
          <body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">
            <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-2.5 shadow-lg">
              <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-cyan-500 flex items-center justify-center font-bold text-white shadow-md mono text-sm">E+H</div>
                  <div>
                    <div class="flex items-center gap-2">
                      <h1 class="text-base md:text-lg font-bold text-white">شبیه‌ساز سه‌بعدی و مرجع تعمیراتی فلومتر الکترومغناطیسی Promag 50</h1>
                      <span class="hidden sm:inline-block px-2 py-0.5 text-xs rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 mono">PCB: 319083-0200 B | FW: V2.04.00</span>
                    </div>
                    <p class="text-xs text-slate-400">شبیه‌ساز زنده قانون فارادی (U = B·L·v)، تحلیل کدهای خطا (#001 تا #698)، کالبدشکافی برد آمپلی‌فایر، برد I/O و دامپ حافظه EEPROM/Flash</p>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                  <div class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 flex items-center gap-1.5"><span class="text-slate-400">دبی حجمی:</span><span id="hdr-flow" class="font-bold text-cyan-400 mono">+45.24 m³/h</span></div>
                  <div class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 flex items-center gap-1.5"><span class="text-slate-400">ولتاژ القایی الکترود:</span><span id="hdr-emf" class="font-bold text-amber-400 mono">+360.0 µV</span></div>
                  <div class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 flex items-center gap-1.5"><span class="text-slate-400">خروجی جریان (26/27):</span><span id="hdr-ma" class="font-bold text-emerald-400 mono">12.00 mA</span></div>
                  <div id="hdr-status-badge" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-semibold flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span id="hdr-status-text">SYSTEM OK (بدون خطا)</span></div>
                </div>
              </div>
              <div class="max-w-[1600px] mx-auto mt-2.5 pt-2 border-t border-slate-800/80 flex flex-wrap gap-1.5">
                <button id="tab-btn-sim3d" class="tab-nav-btn px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition bg-cyan-600 text-white shadow" data-target="view-sim3d">۱. شبیه‌ساز سه‌بعدی زنده دبی، لوله و فیزیک فارادی</button>
                <button id="tab-btn-errors" class="tab-nav-btn px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-target="view-errors">۲. شبیه‌ساز کدهای خطا و پنل ترانسمیتر (#001 تا #698)</button>
                <button id="tab-btn-pcb" class="tab-nav-btn px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-target="view-pcb">۳. مرجع تعمیراتی آی‌سی‌های کارت آمپلی‌فایر (FULL.jpg) و کارت I/O</button>
                <button id="tab-btn-hex" class="tab-nav-btn px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-target="view-hex">۴. تحلیلگر فایل‌های 24LC128.hex / E2PROM.hex و چک‌لیست تست</button>
              </div>
            </header>

            <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 md:p-4 space-y-4">
              <!-- VIEW 1: 3D SIMULATOR -->
              <section id="view-sim3d" class="space-y-4">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
                  <div class="lg:col-span-8 flex flex-col gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col">
                      <div class="px-4 py-2.5 bg-slate-900/90 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                          <h2 class="text-sm font-bold text-white">رندر گرافیکی سه‌بعدی زنده سنسور و لوله (WebGL / Three.js)</h2>
                          <span id="sim3d-mode-badge" class="text-xs px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30">لوله صاف (جریان آرام و متقارن)</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-1.5">
                          <button id="cam-btn-iso" class="px-2.5 py-1 rounded text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">نمای ایزومتریک</button>
                          <button id="cam-btn-cross" class="px-2.5 py-1 rounded text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">برش عرضی (الکترودها)</button>
                          <button id="cam-btn-side" class="px-2.5 py-1 rounded text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">نمای جانبی خط لوله</button>
                          <button id="cam-btn-top" class="px-2.5 py-1 rounded text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">نمای بالا (ترانسمیتر)</button>
                          <button id="toggle-cutaway-btn" class="px-2.5 py-1 rounded text-xs bg-cyan-600/30 text-cyan-200 border border-cyan-500/40">شفاف‌سازی بدنه: فعال</button>
                        </div>
                      </div>
                      <div class="relative w-full h-[380px] md:h-[440px] bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 select-none">
                        <div id="three-canvas-container" class="w-full h-full cursor-grab"></div>
                        <div class="absolute top-3 right-3 bg-slate-900/85 backdrop-blur border border-slate-700/80 rounded-xl p-2.5 text-xs space-y-1 pointer-events-none max-w-[240px]">
                          <div class="font-bold text-slate-200 border-b border-slate-800 pb-1 mb-1">راهنمای اجزای مدل سه‌بعدی:</div>
                          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm bg-amber-500 inline-block"></span><span>بوبین‌های میدان مغناطیسی (41/42)</span></div>
                          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span><span>خطوط میدان مغناطیسی متناوب (B)</span></div>
                          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span><span>الکترودهای اندازه‌گیری (E1 و E2)</span></div>
                          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-purple-400 inline-block"></span><span>الکترود تشخیص لوله خالی (EPD)</span></div>
                          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-cyan-400 inline-block"></span><span>ذرات سیال هادی و پروفایل سرعت (v)</span></div>
                        </div>
                        <div class="absolute bottom-3 left-3 bg-slate-900/90 backdrop-blur border border-slate-700/80 rounded-xl p-2.5 text-xs space-y-1 pointer-events-none">
                          <div class="mono text-sm font-bold text-cyan-300">U_induced = B × D × v × k_profile</div>
                          <div id="physics-formula-live" class="mono text-xs text-amber-300">U = 0.0018 T × 0.080 m × 2.50 m/s = +360.0 µV</div>
                          <div id="epd-overlay-status" class="text-xs font-semibold text-emerald-400">وضعیت الکترود EPD: غوطه‌ور در سیال (امپدانس نرمال: 1.80 kΩ)</div>
                        </div>
                      </div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <h3 class="text-sm font-bold text-white">اسیلوسکوپ زنده ۴ کاناله سیگنال‌های داخلی برد آمپلی‌فایر و برد I/O</h3>
                        <div class="flex flex-wrap items-center gap-3 text-xs">
                          <span class="text-amber-400">● جریان بوبین (BSP373)</span>
                          <span class="text-emerald-400">● ولتاژ خام E1-E2 (TL072C)</span>
                          <span class="text-cyan-400">● خروجی دمودولاتور (DG444DY)</span>
                          <span class="text-purple-400">● پالس و HART (کارت I/O)</span>
                        </div>
                      </div>
                      <div class="relative h-44 w-full bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                        <canvas id="oscilloscope-canvas" class="w-full h-full block"></canvas>
                      </div>
                      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
                        <div class="p-2.5 rounded-xl bg-red-950/30 border border-red-500/30"><div class="text-red-300 font-bold">SECTION 1: بوبین</div><div>جریان: <span id="sig-coil-curr" class="mono text-white font-semibold">±85.0 mA</span></div></div>
                        <div class="p-2.5 rounded-xl bg-amber-950/30 border border-amber-500/30"><div class="text-amber-300 font-bold">SECTION 3: آنالوگ</div><div>E1-E2: <span id="sig-e1e2" class="mono text-white font-semibold">+360.0 µV</span> | نویز: <span id="sig-noise" class="mono text-white">0.6 %</span></div></div>
                        <div class="p-2.5 rounded-xl bg-blue-950/30 border border-blue-500/30"><div class="text-blue-300 font-bold">SECTION 2: دیجیتال</div><div>توتالایزر: <span id="sig-totalizer" class="mono text-white font-semibold">3702.60 m³</span></div></div>
                        <div class="p-2.5 rounded-xl bg-emerald-950/30 border border-emerald-500/30"><div class="text-emerald-300 font-bold">کارت I/O</div><div><span id="sig-io-ma" class="mono text-white font-semibold">12.00 mA</span> | <span id="sig-io-freq" class="mono text-white font-semibold">500.0 Hz</span></div></div>
                      </div>
                    </div>
                  </div>

                  <div class="lg:col-span-4 flex flex-col gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                      <div class="flex items-center justify-between"><h3 class="text-sm font-bold text-white">نمایشگر ۲ خطی ترانسمیتر Promag 50</h3><span class="text-xs text-slate-400 mono">50P/50W-HART</span></div>
                      <div id="main-lcd-box" class="lcd-screen rounded-xl p-3.5 transition-all">
                        <div class="flex justify-between items-center text-xs opacity-75 border-b border-black/15 pb-1 mb-1.5 mono"><span id="lcd-mode-indicator">HOME POSITION</span><span>HART: ADDR 0</span></div>
                        <div id="lcd-line-1" class="text-lg md:text-xl font-bold tracking-wider mono">+45.24 m³/h</div>
                        <div class="text-sm md:text-base font-semibold tracking-wide mono mt-1 flex justify-between"><span id="lcd-line-2-left">∑ 3702.6 m³</span><span id="lcd-line-2-right">[■■□□□□□□]</span></div>
                      </div>
                      <div class="grid grid-cols-4 gap-2 pt-1">
                        <button id="key-btn-minus" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-bold text-base mono text-slate-200">−</button>
                        <button id="key-btn-plus" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-bold text-base mono text-slate-200">+</button>
                        <button id="key-btn-esc" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-bold text-xs mono text-amber-300">Esc (-/+)</button>
                        <button id="key-btn-enter" class="py-2 rounded-xl bg-sky-700 hover:bg-sky-600 border border-sky-500 font-bold text-base mono text-white">E</button>
                      </div>
                      <div class="flex flex-wrap gap-1.5 pt-1">
                        <button id="btn-reboot-sim" class="flex-1 py-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700">شبیه‌سازی روشن شدن (Startup Self-Test)</button>
                        <button id="btn-clear-faults" class="py-1.5 px-3 rounded-lg bg-emerald-600/30 text-xs text-emerald-300 border border-emerald-500/40">پاک کردن خطاها</button>
                      </div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
                      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <h3 class="text-sm font-bold text-cyan-400">پنل تغییر زنده پارامترهای هیدرولیکی و نصب</h3>
                        <button id="btn-reset-params" class="text-xs text-slate-400 hover:text-white underline">بازنشانی</button>
                      </div>
                      <div class="space-y-1.5">
                        <div class="flex justify-between text-xs"><label class="font-semibold text-slate-200">۱. سرعت دبی سیال (v):</label><span id="val-velocity" class="mono font-bold text-cyan-400">+2.50 m/s</span></div>
                        <input id="slider-velocity" type="range" min="-10" max="10" step="0.1" value="2.5" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer" />
                      </div>
                      <div class="space-y-1.5 pt-2 border-t border-slate-800/80">
                        <div class="flex justify-between text-xs"><label class="font-semibold text-slate-200">۲. درصد پر بودن لوله (Pipe Fill):</label><span id="val-fill" class="mono font-bold text-emerald-400">100 % (کاملاً پر)</span></div>
                        <input id="slider-fill" type="range" min="0" max="100" step="5" value="100" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer" />
                        <div class="grid grid-cols-3 gap-1.5 pt-1">
                          <button type="button" class="fill-preset-btn py-1 rounded bg-rose-950/60 border border-rose-500/40 text-rose-300 text-xs" data-fill="0">لوله خالی (0%)</button>
                          <button type="button" class="fill-preset-btn py-1 rounded bg-amber-950/60 border border-amber-500/40 text-amber-300 text-xs" data-fill="55">نیمه‌پر (55%)</button>
                          <button type="button" class="fill-preset-btn py-1 rounded bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 text-xs" data-fill="100">لوله پر (100%)</button>
                        </div>
                        <div class="flex items-center justify-between pt-1 text-xs">
                          <span class="text-slate-400">تشخیص لوله خالی (EPD):</span>
                          <select id="select-epd-mode" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200">
                            <option value="ON_STANDARD" selected>EPD: ON STANDARD</option>
                            <option value="OED">OED: OPEN ELECTRODE</option>
                            <option value="OFF">EPD: OFF (غیرفعال)</option>
                          </select>
                        </div>
                      </div>
                      <div class="space-y-1.5 pt-2 border-t border-slate-800/80">
                        <label class="block text-xs font-semibold text-slate-200">۳. هندسه لوله و رژیم جریان:</label>
                        <div class="grid grid-cols-1 gap-1.5">
                          <button type="button" id="geo-btn-straight" class="geo-mode-btn text-right px-3 py-2 rounded-xl border text-xs bg-cyan-950/60 border-cyan-500 text-cyan-200 font-semibold flex justify-between" data-geo="straight"><span>لوله صاف استاندارد (Inlet ≥ 5×DN)</span><span class="mono">±0.2%</span></button>
                          <button type="button" id="geo-btn-spiral" class="geo-mode-btn text-right px-3 py-2 rounded-xl border text-xs bg-slate-800/70 border-slate-700 text-slate-300 flex justify-between" data-geo="spiral"><span>لوله مارپیچ / زانویی نزدیک (Helical)</span><span class="mono text-amber-300">+4.8%</span></button>
                          <button type="button" id="geo-btn-bubbles" class="geo-mode-btn text-right px-3 py-2 rounded-xl border text-xs bg-slate-800/70 border-slate-700 text-slate-300 flex justify-between" data-geo="bubbles"><span>وجود حباب‌های گاز (Air Bubbles)</span><span class="mono text-rose-300">نوسان شدید</span></button>
                        </div>
                      </div>
                      <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800/80">
                        <div>
                          <div class="flex justify-between text-xs"><span class="text-slate-300">هدایت (σ):</span><span id="val-cond" class="mono text-cyan-300 font-bold">500 µS/cm</span></div>
                          <input id="slider-cond" type="range" min="1" max="1000" step="1" value="500" class="w-full h-2 bg-slate-800 rounded-lg cursor-pointer mt-1" />
                        </div>
                        <div>
                          <label class="block text-xs text-slate-300">قطر سنسور (DN):</label>
                          <select id="select-dn" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200 mono mt-1">
                            <option value="25">DN 25 (1")</option>
                            <option value="50">DN 50 (2")</option>
                            <option value="80" selected>DN 80 (3")</option>
                            <option value="100">DN 100 (4")</option>
                            <option value="200">DN 200 (8")</option>
                          </select>
                        </div>
                      </div>
                      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs leading-relaxed text-slate-300">
                        <div class="font-bold text-cyan-400 mb-1">تحلیل زنده وضعیت کارکرد فلومتر:</div>
                        <p id="live-sim-exp-text">لوله کاملاً پر است (100%) و سیال به صورت صاف و متقارن عبور می‌کند.</p>
                      </div>
                    </div>
                  </div>
                </div>
