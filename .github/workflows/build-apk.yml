              function updateCameraPosition() {
                if (!camera) return;
                camera.position.x = camSpherical.radius * Math.sin(camSpherical.phi) * Math.sin(camSpherical.theta);
                camera.position.y = camSpherical.radius * Math.cos(camSpherical.phi);
                camera.position.z = camSpherical.radius * Math.sin(camSpherical.phi) * Math.cos(camSpherical.theta);
                camera.lookAt(0, 0.2, 0);
              }

              function initThreeJS() {
                const container = document.getElementById('three-canvas-container');
                if (!container || typeof THREE === 'undefined') return;
                const w = container.clientWidth || 800, h = container.clientHeight || 420;
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
                updateCameraPosition();
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(w, h);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.innerHTML = '';
                container.appendChild(renderer.domElement);
                scene.add(new THREE.AmbientLight(0xffffff, 0.65));
                const d1 = new THREE.DirectionalLight(0x38bdf8, 0.9); d1.position.set(6, 10, 8); scene.add(d1);
                const d2 = new THREE.DirectionalLight(0xf59e0b, 0.55); d2.position.set(-7, -5, -4); scene.add(d2);
                const grid = new THREE.GridHelper(16, 16, 0x1e293b, 0x0f172a); grid.position.y = -2.4; scene.add(grid);

                const root = new THREE.Group(); scene.add(root);
                const linerGeo = new THREE.CylinderGeometry(1.05, 1.05, 4.6, 36, 1, true); linerGeo.rotateZ(Math.PI / 2);
                root.add(new THREE.Mesh(linerGeo, new THREE.MeshPhongMaterial({ color: 0x334155, transparent: true, opacity: 0.28, side: THREE.DoubleSide })));

                const shellGeo = new THREE.CylinderGeometry(1.55, 1.55, 2.6, 36, 1, false, 0, Math.PI * 1.45);
                shellGeo.rotateZ(Math.PI / 2); shellGeo.rotateX(Math.PI * 0.25);
                sensorShellMesh = new THREE.Mesh(shellGeo, new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.45, roughness: 0.35, transparent: true, opacity: 0.45, side: THREE.DoubleSide }));
                root.add(sensorShellMesh);

                const flangeCylGeo = new THREE.CylinderGeometry(1.85, 1.85, 0.24, 32); flangeCylGeo.rotateZ(Math.PI / 2);
                const flangeMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.7, roughness: 0.3 });
                [-2.2, 2.2].forEach(xPos => { const fl = new THREE.Mesh(flangeCylGeo, flangeMat); fl.position.x = xPos; root.add(fl); });

                spiralBendMesh = new THREE.Group();
                const spiralMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.55 });
                for (let i = 0; i < 2; i++) {
                  const pts = [];
                  for (let t = 0; t <= 60; t++) {
                    const x = -4.2 + (t / 60) * 8.4, ang = (t / 60) * Math.PI * 6 + i * Math.PI;
                    pts.push(new THREE.Vector3(x, Math.sin(ang) * 0.85, Math.cos(ang) * 0.85));
                  }
                  spiralBendMesh.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, 0.04, 8, false), spiralMat));
                }
                spiralBendMesh.visible = false; root.add(spiralBendMesh);

                const coilMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.65, roughness: 0.25 });
                const coilGeo = new THREE.TorusGeometry(0.68, 0.14, 16, 32); coilGeo.rotateX(Math.PI / 2);
                const topCoil = new THREE.Mesh(coilGeo, coilMat); topCoil.position.set(0, 1.18, 0);
                const botCoil = new THREE.Mesh(coilGeo, coilMat); botCoil.position.set(0, -1.18, 0);
                root.add(topCoil, botCoil);

                const elecGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.35, 16); elecGeo.rotateX(Math.PI / 2);
                const eMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x059669, emissiveIntensity: 0.5 });
                const e1 = new THREE.Mesh(elecGeo, eMat); e1.position.set(0, 0, 1.12);
                const e2 = new THREE.Mesh(elecGeo, eMat); e2.position.set(0, 0, -1.12);
                root.add(e1, e2);

                const epdGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.32, 16);
                epdElectrodeMesh = new THREE.Mesh(epdGeo, new THREE.MeshStandardMaterial({ color: 0xa855f7, emissive: 0x7e22ce, emissiveIntensity: 0.6 }));
                epdElectrodeMesh.position.set(0.45, 1.12, 0); root.add(epdElectrodeMesh);

                const neckMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.9, 20), flangeMat); neckMesh.position.set(0, 1.85, 0); root.add(neckMesh);
                const txGeo = new THREE.CylinderGeometry(0.85, 0.85, 1.35, 28); txGeo.rotateX(Math.PI / 2);
                const txBody = new THREE.Mesh(txGeo, new THREE.MeshStandardMaterial({ color: 0x0369a1, metalness: 0.35, roughness: 0.4 }));
                txBody.position.set(0, 2.65, 0); root.add(txBody);

                const fluidGeo = new THREE.CylinderGeometry(0.98, 0.98, 8.8, 32); fluidGeo.rotateZ(Math.PI / 2);
                fluidMesh = new THREE.Mesh(fluidGeo, new THREE.MeshPhongMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.32 }));
                root.add(fluidMesh);

                const arrowMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
                for (let ix = -1; ix <= 1; ix++) {
                  for (let iz = -1; iz <= 1; iz++) {
                    const grp = new THREE.Group();
                    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.9, 8), arrowMat);
                    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.2, 10), arrowMat);
                    cone.position.y = -0.95; cone.rotation.x = Math.PI;
                    grp.add(shaft, cone); grp.position.set(ix * 0.45, 0, iz * 0.42);
                    root.add(grp); fieldArrows.push(grp);
                  }
                }

                const pGeo = new THREE.SphereGeometry(0.055, 10, 10);
                for (let i = 0; i < 100; i++) {
                  const isBubble = i >= 80;
                  const p = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: isBubble ? 0xfef08a : (i % 2 === 0 ? 0x22d3ee : 0x38bdf8) }));
                  p.userData = { baseR: Math.random() * 0.82, baseTheta: Math.random() * Math.PI * 2, x: -4.2 + Math.random() * 8.4, phase: Math.random() * Math.PI * 2, isBubble };
                  root.add(p); fluidParticles.push(p);
                }

                const dom = renderer.domElement;
                dom.addEventListener('pointerdown', e => { isDragging3D = true; prevMouse = { x: e.clientX, y: e.clientY }; });
                window.addEventListener('pointerup', () => { isDragging3D = false; });
                window.addEventListener('pointermove', e => {
                  if (!isDragging3D) return;
                  camSpherical.theta -= (e.clientX - prevMouse.x) * 0.008;
                  camSpherical.phi = Math.max(0.25, Math.min(Math.PI - 0.25, camSpherical.phi - (e.clientY - prevMouse.y) * 0.008));
                  prevMouse = { x: e.clientX, y: e.clientY };
                  updateCameraPosition();
                });
              }

              function drawOscilloscope(tele) {
                const canvas = document.getElementById('oscilloscope-canvas');
                if (!canvas) return;
                const rect = canvas.parentElement.getBoundingClientRect();
                if (canvas.width !== Math.floor(rect.width) || canvas.height !== Math.floor(rect.height)) {
                  canvas.width = Math.floor(rect.width) || 600; canvas.height = Math.floor(rect.height) || 176;
                }
                const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
                for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
                for (let y = 0; y < h; y += 35) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
                const coilFault = tele.activeFault && tele.activeFault.code === '#321';
                const ampFault = tele.activeFault && tele.activeFault.code === '#101';
                const normV = Math.max(-1, Math.min(1, tele.effectiveV / 10));

                const drawTrace = (color, fn) => {
                  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
                  for (let x = 0; x < w; x++) { const y = fn(x, clockTime * 2.5 + x * 0.045); if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
                  ctx.stroke();
                };
                drawTrace('#fbbf24', (x, t) => 32 - (coilFault ? 0 : (Math.sin(t) >= 0 ? 16 : -16)));
                drawTrace('#34d399', (x, t) => {
                  const sq = coilFault ? 0 : (Math.sin(t) >= 0 ? 1 : -1);
                  const noise = (state.pipeGeo === 'spiral' ? Math.sin(t * 4.3) * 5 : 0) + (state.pipeGeo === 'bubbles' ? Math.sin(t * 11.7) * 9 : 0);
                  return 82 - (sq * normV * 20) + noise;
                });
                drawTrace('#22d3ee', (x, t) => 125 - (normV * 20 * (ampFault ? 1.45 * Math.sin(t * 0.5) : 1.0)));
                drawTrace('#c084fc', (x, t) => 156 - (tele.freqHz > 1 ? (Math.sin(t * 3) > 0 ? 7 : -7) : 0) + Math.sin(t * 12) * 2.5);
              }

              function animateLoop() {
                animId = requestAnimationFrame(animateLoop);
                clockTime += 0.035;
                const tele = computeTelemetry();
                if (tele.totalizerCounting && Math.abs(tele.flowM3h) > 0.01) state.totalizer += (Math.abs(tele.flowM3h) / 3600) * 0.03;
                if (fluidMesh) {
                  fluidMesh.visible = state.fillLevel > 2;
                  const fillRatio = state.fillLevel / 100;
                  fluidMesh.scale.y = Math.max(0.05, fillRatio);
                  fluidMesh.position.y = -0.98 * (1 - fillRatio);
                }
                if (spiralBendMesh) spiralBendMesh.visible = (state.pipeGeo === 'spiral');
                const coilFault = tele.activeFault && tele.activeFault.code === '#321';
                const bSign = Math.sin(clockTime * 1.6) >= 0 ? 1 : -1;
                fieldArrows.forEach(arr => { arr.visible = !coilFault; arr.scale.y = bSign; });
                const maxY = -0.95 + (state.fillLevel / 100) * 1.9;
                fluidParticles.forEach(p => {
                  const u = p.userData;
                  if (state.fillLevel <= 2 || (u.isBubble && state.pipeGeo !== 'bubbles')) { p.visible = false; return; }
                  u.x += tele.effectiveV * 0.022;
                  if (u.x > 4.2) u.x = -4.2; if (u.x < -4.2) u.x = 4.2;
                  const ang = state.pipeGeo === 'spiral' ? (u.baseTheta + u.x * 1.6 + clockTime * 2.0) : u.baseTheta;
                  const y = Math.sin(ang) * u.baseR, z = Math.cos(ang) * u.baseR;
                  p.visible = y <= maxY;
                  p.position.set(u.x, y, z);
                });
                if (renderer && scene && camera) renderer.render(scene, camera);
                drawOscilloscope(tele);
              }

              function syncUI() {
                if (state.isBooting) return;
                const tele = computeTelemetry();
                const signStr = tele.flowM3h >= 0 ? '+' : '';
                document.getElementById('hdr-flow').textContent = `${signStr}${tele.flowM3h.toFixed(2)} m³/h`;
                document.getElementById('hdr-emf').textContent = `${tele.emfMicroV >= 0 ? '+' : ''}${tele.emfMicroV.toFixed(1)} µV`;
                document.getElementById('hdr-ma').textContent = `${tele.currentMa.toFixed(2)} mA`;
                document.getElementById('hdr-status-text').textContent = tele.activeFault ? `${tele.activeFault.code}: ${tele.activeFault.lcdLine1}` : 'SYSTEM OK (بدون خطا)';
                document.getElementById('physics-formula-live').textContent = `U = ${tele.B.toFixed(4)} T × ${tele.dMeters.toFixed(3)} m × ${tele.effectiveV.toFixed(2)} m/s = ${tele.emfMicroV.toFixed(1)} µV`;
                document.getElementById('sig-coil-curr').textContent = (tele.activeFault && tele.activeFault.code === '#321') ? '0.0 mA (#321)' : '±85.0 mA';
                document.getElementById('sig-e1e2').textContent = `${tele.emfMicroV.toFixed(1)} µV`;
                document.getElementById('sig-noise').textContent = `${tele.noisePct.toFixed(1)} %`;
                document.getElementById('sig-totalizer').textContent = `${state.totalizer.toFixed(2)} m³`;
                document.getElementById('sig-io-ma').textContent = `${tele.currentMa.toFixed(2)} mA`;
                document.getElementById('sig-io-freq').textContent = `${tele.freqHz.toFixed(1)} Hz`;

                const lcdBox = document.getElementById('main-lcd-box');
                const lcdL1 = document.getElementById('lcd-line-1');
                const lcdL2Left = document.getElementById('lcd-line-2-left');
                if (tele.activeFault && state.lcdMenuIndex === 0) {
                  lcdBox.classList.toggle('fault-flash', tele.activeFault.severity === 'FAULT');
                  lcdL1.textContent = tele.activeFault.lcdLine1;
                  lcdL2Left.textContent = tele.activeFault.lcdLine2;
                } else {
                  lcdBox.classList.remove('fault-flash');
                  lcdL1.textContent = `${signStr}${tele.flowM3h.toFixed(2)} m³/h`;
                  lcdL2Left.textContent = `∑ ${state.totalizer.toFixed(1)} m³`;
                }

                if (tele.activeFault) {
                  document.getElementById('err-lcd-line1').textContent = tele.activeFault.lcdLine1;
                  document.getElementById('err-lcd-line2').textContent = tele.activeFault.lcdLine2;
                  document.getElementById('err-detail-title').textContent = tele.activeFault.title;
                  document.getElementById('err-detail-code').textContent = tele.activeFault.code;
                  document.getElementById('err-detail-cause').textContent = tele.activeFault.cause;
                  document.getElementById('err-detail-remedy').textContent = tele.activeFault.remedy;
                  document.getElementById('err-detail-ics').textContent = tele.activeFault.ics.join(' , ').toUpperCase();
                } else {
                  document.getElementById('err-lcd-line1').textContent = `SYSTEM OK (${signStr}${tele.flowM3h.toFixed(2)} m³/h)`;
                  document.getElementById('err-lcd-line2').textContent = '→ OPERATION (NO ACTIVE ERRORS)';
                }
                document.getElementById('err-out-current').textContent = `${tele.currentMa.toFixed(2)} mA`;
                document.getElementById('err-out-pulse').textContent = `${tele.freqHz.toFixed(1)} Hz`;
                document.getElementById('err-out-status').textContent = tele.statusConductive ? 'Conductive (وصل)' : 'Non-Conductive (آلارم)';

                document.querySelectorAll('.pcb-hotspot').forEach(spot => {
                  const icId = spot.getAttribute('data-ic-id');
                  spot.classList.toggle('fault-target', Boolean(tele.activeFault && tele.activeFault.ics.includes(icId)));
                });
              }

              function selectIC(icId) {
                const ic = PCB_ICS.find(x => x.id === icId) || PCB_ICS[0];
                state.selectedIcId = ic.id;
                document.getElementById('amp-board-map-wrapper').classList.toggle('hidden', ic.board === 'IO');
                document.getElementById('io-board-map-wrapper').classList.toggle('hidden', ic.board !== 'IO');
                document.querySelectorAll('.pcb-hotspot').forEach(el => el.classList.toggle('active', el.getAttribute('data-ic-id') === ic.id));
                document.getElementById('ic-card-section-badge').textContent = ic.section;
                document.getElementById('ic-card-title').textContent = ic.name;
                document.getElementById('ic-card-pkg').textContent = ic.pkg;
                document.getElementById('ic-card-role').textContent = ic.role;
                document.getElementById('ic-card-pins').textContent = ic.pins;
                document.getElementById('ic-card-faults').textContent = ic.faults;
                document.getElementById('ic-card-test').textContent = ic.test;
                document.getElementById('ic-card-equiv').textContent = ic.equiv;
              }

              function renderPcbHotspots() {
                const layer = document.getElementById('pcb-hotspots-layer');
                const ioGrid = document.getElementById('io-board-blocks-grid');
                const chips = document.getElementById('ic-quick-chips');
                layer.innerHTML = ''; ioGrid.innerHTML = ''; chips.innerHTML = '';
                PCB_ICS.forEach(ic => {
                  const chip = document.createElement('button');
                  chip.className = 'px-2 py-1 rounded-lg text-[11px] mono border bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700';
                  chip.textContent = ic.id.toUpperCase();
                  chip.onclick = () => selectIC(ic.id);
                  chips.appendChild(chip);
                  if (ic.board === 'AMP' && ic.rect) {
                    const spot = document.createElement('div');
                    const secClass = ic.section === 'SECTION 1' ? 'sec-1-spot' : (ic.section === 'SECTION 2' ? 'sec-2-spot' : 'sec-3-spot');
                    spot.className = `pcb-hotspot ${secClass}`;
                    spot.setAttribute('data-ic-id', ic.id);
                    spot.style.left = `${ic.rect.left}%`; spot.style.top = `${ic.rect.top}%`;
                    spot.style.width = `${ic.rect.width}%`; spot.style.height = `${ic.rect.height}%`;
                    spot.innerHTML = `<span class="px-1 py-0.5 rounded bg-slate-950/85 text-[10px] font-bold text-white mono">${ic.id.toUpperCase().slice(0,8)}</span>`;
                    spot.onclick = () => selectIC(ic.id);
                    layer.appendChild(spot);
                  } else if (ic.board === 'IO') {
                    const card = document.createElement('div');
                    card.className = 'p-3 rounded-xl bg-slate-950/90 hover:bg-slate-900 border border-emerald-500/40 cursor-pointer space-y-1';
                    card.innerHTML = `<div class="text-xs font-bold text-emerald-300">${ic.name}</div><p class="text-[11px] text-slate-400">${ic.role}</p>`;
                    card.onclick = () => selectIC(ic.id);
                    ioGrid.appendChild(card);
                  }
                });
                selectIC(state.selectedIcId);
              }

              function renderErrorList(filterCat = 'ALL', query = '') {
                const container = document.getElementById('error-list-container');
                container.innerHTML = '';
                const q = query.trim().toLowerCase();
                ERROR_DB.filter(err => (filterCat === 'ALL' || err.cat === filterCat) && (!q || err.code.toLowerCase().includes(q) || err.title.toLowerCase().includes(q) || err.lcdLine1.toLowerCase().includes(q))).forEach(err => {
                  const card = document.createElement('div');
                  const isSel = state.activeFaultCode === err.code;
                  card.className = `p-3 rounded-xl border cursor-pointer flex flex-col gap-1 ${isSel ? 'bg-cyan-950/50 border-cyan-400' : 'bg-slate-950/80 border-slate-800'}`;
                  card.innerHTML = `<div class="flex items-center justify-between"><span class="font-bold text-xs text-white">${err.code} — ${err.title}</span><span class="mono text-xs text-cyan-300">${err.lcdLine1}</span></div><p class="text-xs text-slate-400">${err.cause}</p>`;
                  card.onclick = () => {
                    state.activeFaultCode = isSel ? null : err.code;
                    renderErrorList(filterCat, query);
                    syncUI();
                  };
                  container.appendChild(card);
                });
              }

              function renderHexAndChecklist() {
                document.getElementById('eeprom-pages-tbody').innerHTML = EEPROM_PAGES.map(r => `<tr><td class="p-2 mono font-bold text-cyan-400">${r.page}</td><td class="p-2 mono text-amber-300">${r.hdr}</td><td class="p-2 mono text-slate-200 text-[11px]">${r.data}</td><td class="p-2 text-slate-300">${r.desc}</td></tr>`).join('');
                document.getElementById('repair-checklist-container').innerHTML = REPAIR_CHECKLIST.map(g => `<div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2"><div class="font-bold text-cyan-400 text-xs">${g.step}</div>${g.items.map(it => `<label class="flex items-start gap-2 cursor-pointer text-slate-300"><input type="checkbox" class="repair-chk-item mt-1" /><span>${it}</span></label>`).join('')}</div>`).join('');
              }

              window.addEventListener('load', () => {
                renderRealisticPcbImage();
                renderPcbHotspots();
                renderErrorList();
                renderHexAndChecklist();
                initThreeJS();
                syncUI();
                animateLoop();

                document.querySelectorAll('.tab-nav-btn').forEach(btn => {
                  btn.onclick = () => {
                    const target = btn.getAttribute('data-target');
                    ['view-sim3d','view-errors','view-pcb','view-hex'].forEach(id => document.getElementById(id).classList.toggle('hidden', id !== target));
                    document.querySelectorAll('.tab-nav-btn').forEach(b => b.className = b === btn ? 'tab-nav-btn px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-cyan-600 text-white shadow' : 'tab-nav-btn px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-slate-800 text-slate-300');
                  };
                });
                document.getElementById('cam-btn-iso').onclick = () => { camSpherical = { radius: 8.8, theta: 0.65, phi: 1.15 }; updateCameraPosition(); };
                document.getElementById('cam-btn-cross').onclick = () => { camSpherical = { radius: 6.5, theta: 1.57, phi: 1.52 }; updateCameraPosition(); };
                document.getElementById('cam-btn-side').onclick = () => { camSpherical = { radius: 8.5, theta: 0.02, phi: 1.48 }; updateCameraPosition(); };
                document.getElementById('cam-btn-top').onclick = () => { camSpherical = { radius: 8.2, theta: 0.3, phi: 0.35 }; updateCameraPosition(); };
                document.getElementById('toggle-cutaway-btn').onclick = (e) => { state.cutaway = !state.cutaway; if (sensorShellMesh) sensorShellMesh.material.opacity = state.cutaway ? 0.45 : 0.96; e.currentTarget.textContent = `شفاف‌سازی بدنه: ${state.cutaway ? 'فعال' : 'غیرفعال'}`; };
                document.getElementById('slider-velocity').oninput = (e) => { state.velocity = parseFloat(e.target.value); document.getElementById('val-velocity').textContent = `${state.velocity >= 0 ? '+' : ''}${state.velocity.toFixed(2)} m/s`; syncUI(); };
                document.getElementById('slider-fill').oninput = (e) => { state.fillLevel = parseInt(e.target.value, 10); document.getElementById('val-fill').textContent = `${state.fillLevel} %`; syncUI(); };
                document.querySelectorAll('.fill-preset-btn').forEach(b => b.onclick = () => { const v = parseInt(b.getAttribute('data-fill'), 10); state.fillLevel = v; document.getElementById('slider-fill').value = v; document.getElementById('val-fill').textContent = `${v} %`; syncUI(); });
                document.getElementById('select-epd-mode').onchange = (e) => { state.epdMode = e.target.value; syncUI(); };
                document.querySelectorAll('.geo-mode-btn').forEach(b => b.onclick = () => { state.pipeGeo = b.getAttribute('data-geo'); syncUI(); });
                document.getElementById('slider-cond').oninput = (e) => { state.conductivity = parseInt(e.target.value, 10); document.getElementById('val-cond').textContent = `${state.conductivity} µS/cm`; syncUI(); };
                document.getElementById('select-dn').onchange = (e) => { state.dn = parseInt(e.target.value, 10); syncUI(); };
                document.getElementById('btn-clear-faults').onclick = () => { state.activeFaultCode = null; state.fillLevel = 100; state.conductivity = 500; renderErrorList(); syncUI(); };
                document.getElementById('btn-jump-to-pcb').onclick = () => { const tele = computeTelemetry(); const ic = (tele.activeFault && tele.activeFault.ics[0]) || 'hd64f3048'; document.getElementById('tab-btn-pcb').click(); selectIC(ic); };
                document.getElementById('subtab-amp-board').onclick = () => selectIC('hd64f3048');
                document.getElementById('subtab-io-board').onclick = () => selectIC('io_dac_420');
                document.getElementById('btn-toggle-hotspots').onclick = () => { state.showHotspots = !state.showHotspots; document.getElementById('pcb-hotspots-layer').classList.toggle('hidden', !state.showHotspots); };
                document.getElementById('select-failsafe-mode').onchange = (e) => { state.failsafeMode = e.target.value; syncUI(); };
                document.getElementById('error-search-input').oninput = (e) => renderErrorList('ALL', e.target.value);
                document.querySelectorAll('.err-cat-btn').forEach(b => b.onclick = () => renderErrorList(b.getAttribute('data-cat'), document.getElementById('error-search-input').value));
              });
            </script>
          </body>
          </html>
